<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作流调试台</title>
<style>
  :root {
    --bg: #f4f3ef;
    --panel: #ffffff;
    --ink: #1d1f23;
    --muted: #6b6f76;
    --line: #e2e0d9;
    --accent: #1f6f5c;
    --accent-soft: #e3f0eb;
    --warn: #b4531f;
    --warn-soft: #f8e9df;
    --user: #1f3b6f;
    --user-soft: #e6ecf7;
    --code-bg: #f7f6f2;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --panel: #1d2024; --ink: #e6e4de; --muted: #9a9ea6; --line: #2e3237;
      --accent: #5fbf9f; --accent-soft: #1f3530; --warn: #e3905f; --warn-soft: #3a2a20;
      --user: #9db8ea; --user-soft: #222c3d; --code-bg: #171a1d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); }
  button, input, select, textarea { font: inherit; color: inherit; }

  .app { display: grid; grid-template-columns: minmax(360px, 5fr) 7fr; height: 100vh; }
  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); height: auto; }
    .chat { border-right: 0; border-bottom: 1px solid var(--line); }
    .messages { min-height: 50vh; }
    .debug { min-height: 80vh; }
    header.bar h1 { display: none; }
    .tabs { overflow-x: auto; }
  }

  header.bar {
    display: flex; gap: 8px; align-items: center; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header.bar h1 { font-size: 14px; margin: 0 8px 0 0; letter-spacing: .02em; white-space: nowrap; }
  header.bar select { flex: 1; min-width: 0; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  select, input[type=text], textarea {
    border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 8px;
  }

  /* ---------- chat ---------- */
  .chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .messages { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-soft); color: var(--user); border-bottom-right-radius: 3px; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
  .msg .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; font-family: var(--mono); cursor: pointer; }
  .msg .meta:hover { color: var(--accent); }
  .msg.error { border-color: var(--warn); background: var(--warn-soft); }
  .empty { color: var(--muted); text-align: center; margin: auto; font-size: 13px; }

  .composer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 14px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .presets button { font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .composer form { display: flex; gap: 8px; }
  .composer textarea { flex: 1; resize: none; height: 40px; }

  /* ---------- debug ---------- */
  .debug { display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; gap: 2px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .tabs button {
    border: 0; background: none; padding: 11px 12px; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .pane { flex: 1; overflow-y: auto; padding: 14px; display: none; }
  .pane.on { display: block; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
  .card > .hd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .card > .bd { padding: 10px 12px; }
  .card.collapsed > .bd { display: none; }
  .card.collapsed > .hd { border-bottom: 0; }
  .hd.click { cursor: pointer; }
  .tag { font: 11px/1.6 var(--mono); padding: 0 6px; border-radius: 4px; background: var(--code-bg); border: 1px solid var(--line); }
  .tag.ok { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .tag.err { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .muted { color: var(--muted); }
  .grow { flex: 1; }
  .mono { font-family: var(--mono); font-size: 12px; }

  pre.json {
    margin: 6px 0 0; padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px;
    font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto;
  }
  .label { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .label:first-child { margin-top: 0; }

  .path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .path .node { font: 12px var(--mono); padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
  .path .arrow { color: var(--muted); }

  .events { font: 12px/1.7 var(--mono); }
  .events .ev { display: flex; gap: 10px; border-bottom: 1px dashed var(--line); padding: 2px 0; }
  .events .ev .t { color: var(--muted); width: 64px; flex-shrink: 0; }
  .events .ev .k { width: 84px; flex-shrink: 0; color: var(--accent); }
  .events .ev.error .k { color: var(--warn); }
  .events .ev .v { word-break: break-all; }

  .turn-row { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .turn-row:last-child { border-bottom: 0; }
  .turn-row:hover { background: var(--code-bg); }
  .turn-row.on { background: var(--accent-soft); }
  .turn-row .seq { font: 12px var(--mono); color: var(--muted); width: 28px; }
  .turn-row .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .role { font: 11px var(--mono); text-transform: uppercase; color: var(--muted); }
  .chatmsg { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
  .chatmsg.SYSTEM { border-left-color: var(--warn); }
  .chatmsg.USER { border-left-color: var(--user); }
  .chatmsg.AI { border-left-color: var(--accent); }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; font: 12px var(--mono); color: var(--muted); }
  details > summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* ---------- 节点 / 提示词 ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar input { flex: 1; min-width: 160px; }
  .reg { width: 100%; border-collapse: collapse; font-size: 13px; }
  .reg th, .reg td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .reg th { font-weight: 500; color: var(--muted); font-size: 12px; }
  .reg tr:last-child td { border-bottom: 0; }
  .reg .tag, .reg td.mono { white-space: nowrap; }
  .reg .ok { color: var(--accent); font-weight: 600; }
  .reg .bad { color: var(--warn); font-weight: 600; }
  .reg a { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
  .reg .ex { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tablewrap { overflow-x: auto; }
  .tag.task { color: var(--user); background: var(--user-soft); border-color: transparent; }
  .tag.fb { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .prompt-hd { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .prompt-hd:first-child { margin-top: 0; }
  .prompt-hd .mono { color: var(--muted); }
  .prompt-hd button { font-size: 11px; padding: 1px 8px; }
  pre.prompt { max-height: 480px; }
  pre.prompt mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 2px; }
  .card.flash { outline: 2px solid var(--accent); outline-offset: 2px; transition: outline-color .8s; }
</style>
</head>
<body>
<div class="app">
  <!-- ======================= 对话 ======================= -->
  <section class="chat">
    <header class="bar">
      <h1>工作流调试台</h1>
      <select id="sessionSelect" title="历史会话"></select>
      <button class="btn" id="newSessionBtn">新会话</button>
    </header>
    <div class="messages" id="messages"><div class="empty">发一条消息开始测试</div></div>
    <div class="composer">
      <div class="presets" id="presets"></div>
      <form id="form">
        <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="btn primary" id="sendBtn" type="submit">发送</button>
      </form>
    </div>
  </section>

  <!-- ======================= 调试 ======================= -->
  <section class="debug">
    <nav class="tabs" id="tabs">
      <button data-pane="paneLive" class="on">实时事件</button>
      <button data-pane="paneTurn">轮次详情</button>
      <button data-pane="paneTurns">轮次列表</button>
      <button data-pane="paneState">会话状态</button>
      <button data-pane="paneNodes">节点 / 提示词</button>
    </nav>
    <div class="pane on" id="paneLive"><div class="empty">发送消息后这里会实时显示节点流转、路由结果和 token</div></div>
    <div class="pane" id="paneTurn"><div class="empty">点击某条回复下方的轮次号，或在"轮次列表"里选择</div></div>
    <div class="pane" id="paneTurns"></div>
    <div class="pane" id="paneState"></div>
    <div class="pane" id="paneNodes"><div class="empty">加载中…</div></div>
  </section>
</div>

<script>
(() => {
  const PRESETS = ['我想办一个活动', '60岁以上的女性', '今天天气怎么样', '阳光社区', '社保怎么查', '算了不办了'];
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pretty = v => {
    if (v == null) return 'null';
    if (typeof v === 'string') { try { return JSON.stringify(JSON.parse(v), null, 2); } catch { return v; } }
    return JSON.stringify(v, null, 2);
  };
  const parse = v => { if (typeof v !== 'string') return v; try { return JSON.parse(v); } catch { return v; } };
  const time = () => new Date().toTimeString().slice(0, 8);

  const store = {
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };

  let sessionId = store.get('flow.sessionId') || newId();
  let sending = false;

  function newId() {
    return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).slice(0, 18);
  }

  // ---------------------------------------------------------------- tabs
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    showPane(b.dataset.pane);
  });
  function showPane(id) {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.pane === id));
    document.querySelectorAll('.pane').forEach(x => x.classList.toggle('on', x.id === id));
    // 每次切到这个页签都重新拉取，看到的永远是服务端当前注册的节点和提示词
    if (id === 'paneNodes') loadNodes();
  }

  // ---------------------------------------------------------------- presets / composer
  PRESETS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'btn'; b.type = 'button'; b.textContent = p;
    b.onclick = () => send(p);
    $('presets').appendChild(b);
  });
  $('form').addEventListener('submit', e => { e.preventDefault(); send($('input').value); });
  $('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($('input').value); }
  });
  $('newSessionBtn').onclick = () => { sessionId = newId(); store.set('flow.sessionId', sessionId); loadSessions(); loadSession(); };
  $('sessionSelect').onchange = e => { sessionId = e.target.value; store.set('flow.sessionId', sessionId); loadSession(); };

  // ---------------------------------------------------------------- messages
  function addMsg(role, text, turnId) {
    const box = $('messages');
    box.querySelector('.empty')?.remove();
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    const body = document.createElement('span');
    body.textContent = text || '';
    el.appendChild(body);
    if (turnId) setMeta(el, turnId);
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
    return { el, body };
  }
  function setMeta(el, turnId, extra) {
    let m = el.querySelector('.meta');
    if (!m) { m = document.createElement('span'); m.className = 'meta'; el.appendChild(m); }
    m.textContent = 'turn ' + turnId.slice(0, 8) + (extra ? ' · ' + extra : '');
    m.onclick = () => openTurn(turnId);
  }

  // ---------------------------------------------------------------- send (SSE over POST)
  async function send(text) {
    text = (text || '').trim();
    if (!text || sending) return;
    sending = true; $('sendBtn').disabled = true; $('input').value = '';
    addMsg('user', text);
    const ai = addMsg('assistant', '');
    const live = $('paneLive');
    live.innerHTML = `<div class="card"><div class="hd"><b>本轮</b><span class="muted grow mono">${esc(text)}</span></div>
      <div class="bd"><div class="events" id="events"></div></div></div>`;
    showPane('paneLive');
    const evBox = $('events');
    const log = (k, v, cls) => {
      const d = document.createElement('div');
      d.className = 'ev ' + (cls || '');
      d.innerHTML = `<span class="t">${time()}</span><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`;
      evBox.appendChild(d);
    };

    let turnId = null, tokenBuf = '', reply = '';
    try {
      const resp = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
        body: JSON.stringify({ sessionId, message: text }),
      });
      if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status + ' ' + (await resp.text()).slice(0, 200));
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buf.search(/\r?\n\r?\n/)) >= 0) {
          const raw = buf.slice(0, idx);
          buf = buf.slice(idx).replace(/^\r?\n\r?\n/, '');
          handleEvent(raw);
        }
      }
    } catch (err) {
      ai.el.classList.add('error');
      ai.body.textContent = '请求失败：' + err.message;
      log('error', err.message, 'error');
    } finally {
      sending = false; $('sendBtn').disabled = false; $('input').focus();
    }

    function handleEvent(raw) {
      let name = 'message', data = '';
      raw.split(/\r?\n/).forEach(line => {
        if (line.startsWith('event:')) name = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5);
      });
      const d = parse(data) || {};
      switch (name) {
        case 'turn':
          turnId = d.turnId; log('turn', `#${d.seq}  ${d.turnId}`); break;
        case 'node_start':
          flushTokens(); log('node ▶', `${d.node}  (${d.type})`); break;
        case 'node_end':
          flushTokens(); log('node ■', `${d.node}  ${d.status}  ${d.latencyMs}ms`, d.status === 'ERROR' ? 'error' : ''); break;
        case 'route':
          log('route', `${d.action} / ${d.intent} → ${d.target}${d.fallback ? '  [兜底]' : ''}  ${d.reason || ''}`); break;
        case 'token':
          reply += d.text; tokenBuf += d.text; ai.body.textContent = reply;
          $('messages').scrollTop = $('messages').scrollHeight; break;
        case 'done':
          flushTokens();
          log('done', `${d.latencyMs}ms  path=${(d.nodePath || []).join(' → ')}`);
          ai.body.textContent = d.reply || reply;
          setMeta(ai.el, d.turnId, (d.nodePath || []).join('→'));
          renderState(d.state);
          loadSessions(); refreshTurns().then(() => openTurn(d.turnId, false));
          break;
        case 'error':
          flushTokens();
          log('error', d.message, 'error');
          ai.el.classList.add('error');
          ai.body.textContent = (reply ? reply + '\n\n' : '') + '出错：' + d.message;
          if (d.turnId) setMeta(ai.el, d.turnId);
          refreshTurns();
          break;
      }
    }
    function flushTokens() { if (tokenBuf) { log('tokens', tokenBuf.replace(/\n/g, '⏎')); tokenBuf = ''; } }
  }

  // ---------------------------------------------------------------- session
  async function loadSessions() {
    try {
      const list = await (await fetch('/api/sessions')).json();
      const sel = $('sessionSelect');
      const ids = list.map(s => s.session_id);
      if (!ids.includes(sessionId)) list.unshift({ session_id: sessionId, turn_count: 0 });
      sel.innerHTML = list.map(s =>
        `<option value="${esc(s.session_id)}" ${s.session_id === sessionId ? 'selected' : ''}>${esc(s.session_id)} · ${s.turn_count} 轮</option>`).join('');
    } catch (e) { console.warn(e); }
  }

  async function loadSession() {
    $('messages').innerHTML = '';
    $('paneTurn').innerHTML = '<div class="empty">点击某条回复下方的轮次号，或在"轮次列表"里选择</div>';
    const r = await fetch('/api/sessions/' + encodeURIComponent(sessionId));
    if (r.status === 404) {
      $('messages').innerHTML = '<div class="empty">新会话：' + esc(sessionId) + '</div>';
      renderState(null); renderTurns([]); return;
    }
    const s = await r.json();
    const turnMeta = {};
    (s.turns || []).forEach(t => turnMeta[t.turn_id] = parse(t.node_path));
    (s.messages || []).forEach(m => {
      const el = addMsg(m.role, m.content).el;
      if (m.role === 'assistant') setMeta(el, m.turn_id, (turnMeta[m.turn_id] || []).join('→'));
    });
    if (!(s.messages || []).length) $('messages').innerHTML = '<div class="empty">该会话还没有消息</div>';
    renderState(s.state);
    renderTurns(s.turns || []);
  }

  async function refreshTurns() {
    const r = await fetch('/api/sessions/' + encodeURIComponent(sessionId));
    if (r.ok) renderTurns((await r.json()).turns || []);
  }

  function renderState(state) {
    const pane = $('paneState');
    if (!state) { pane.innerHTML = '<div class="empty">暂无状态</div>'; return; }
    const stack = state.taskStack || [];
    const tasks = stack.length ? stack.map((t, i) => `
      <div class="card"><div class="hd">
        <b>${esc(t.taskType)}</b>${i === stack.length - 1 ? '<span class="tag ok">栈顶</span>' : ''}
        <span class="tag">${esc(t.status)}</span><span class="grow"></span>
        <span class="muted mono">当前节点</span><span class="path"><span class="node">${esc(t.currentNode)}</span></span>
      </div><div class="bd"><div class="label">已收集槽位</div><pre class="json">${esc(pretty(t.slots))}</pre></div></div>`).join('')
      : '<div class="card"><div class="bd muted">任务栈为空</div></div>';
    pane.innerHTML = `<div class="label">任务栈（${stack.length}）</div>${tasks}
      <details><summary>完整会话状态 JSON</summary><pre class="json">${esc(pretty(state))}</pre></details>`;
  }

  function renderTurns(turns) {
    const pane = $('paneTurns');
    if (!turns.length) { pane.innerHTML = '<div class="empty">暂无轮次</div>'; return; }
    pane.innerHTML = '<div class="card">' + turns.slice().reverse().map(t => `
      <div class="turn-row" data-id="${esc(t.turn_id)}">
        <span class="seq">#${t.seq}</span>
        <span class="txt">${esc(t.user_input)}</span>
        <span class="mono muted">${esc((parse(t.node_path) || []).join('→'))}</span>
        <span class="tag ${t.status === 'SUCCESS' ? 'ok' : t.status === 'ERROR' ? 'err' : ''}">${esc(t.status)}</span>
        <span class="mono muted">${t.latency_ms ?? '-'}ms</span>
      </div>`).join('') + '</div>';
    pane.querySelectorAll('.turn-row').forEach(r => r.onclick = () => openTurn(r.dataset.id));
  }

  // ---------------------------------------------------------------- turn detail
  async function openTurn(turnId, switchTab = true) {
    const pane = $('paneTurn');
    pane.innerHTML = '<div class="empty">加载中…</div>';
    if (switchTab) showPane('paneTurn');
    document.querySelectorAll('.turn-row').forEach(r => r.classList.toggle('on', r.dataset.id === turnId));
    const r = await fetch('/api/turns/' + encodeURIComponent(turnId));
    if (!r.ok) { pane.innerHTML = '<div class="empty">找不到该轮次</div>'; return; }
    const { turn, nodes, llmCalls, toolCalls } = await r.json();
    const path = parse(turn.node_path) || [];
    const callsByExec = {};
    llmCalls.forEach(c => (callsByExec[c.exec_id] = callsByExec[c.exec_id] || []).push(c));
    const tokens = llmCalls.reduce((a, c) => a + (c.total_tokens || 0), 0);

    pane.innerHTML = `
      <div class="card"><div class="hd">
        <b>#${turn.seq}</b><span class="mono muted">${esc(turn.turn_id)}</span><span class="grow"></span>
        <span class="tag ${turn.status === 'SUCCESS' ? 'ok' : 'err'}">${esc(turn.status)}</span>
      </div><div class="bd">
        <div class="stats"><span>耗时 ${turn.latency_ms ?? '-'}ms</span><span>模型调用 ${llmCalls.length} 次</span>
          <span>tokens ${tokens}</span><span>路由 ${esc(turn.route_action || '-')} → ${esc(turn.route_target || '-')}</span></div>
        <div class="label">节点路径</div>
        <div class="path">${path.map(n => `<span class="node">${esc(n)}</span>`).join('<span class="arrow">→</span>') || '<span class="muted">-</span>'}</div>
        <div class="label">用户输入</div><div>${esc(turn.user_input)}</div>
        <div class="label">最终回复</div><div style="white-space:pre-wrap">${esc(turn.final_reply || '')}</div>
        ${turn.error_msg ? `<div class="label">错误</div><pre class="json">${esc(turn.error_msg)}</pre>` : ''}
        <details><summary>执行前状态</summary><pre class="json">${esc(pretty(turn.state_before))}</pre></details>
        <details><summary>执行后状态</summary><pre class="json">${esc(pretty(turn.state_after))}</pre></details>
      </div></div>
      <div class="label">节点执行（${nodes.length}）</div>
      ${nodes.map(n => nodeCard(n, callsByExec[n.exec_id] || [])).join('')}
      ${toolCalls.length ? `<div class="label">工具调用（${toolCalls.length}）</div>` + toolCalls.map(toolCard).join('') : ''}`;

    pane.querySelectorAll('.hd.click').forEach(h => h.onclick = () => h.parentElement.classList.toggle('collapsed'));
  }

  function nodeCard(n, calls) {
    return `<div class="card"><div class="hd click">
        <span class="mono muted">${n.seq}</span><b>${esc(n.node_id)}</b><span class="tag">${esc(n.node_type)}</span>
        <span class="grow"></span><span class="mono muted">${n.latency_ms ?? '-'}ms</span>
        <span class="tag ${n.status === 'SUCCESS' ? 'ok' : 'err'}">${esc(n.status)}</span>
      </div><div class="bd">
        ${n.error_msg ? `<div class="label">错误</div><pre class="json">${esc(n.error_msg)}</pre>` : ''}
        <details><summary>节点输入状态</summary><pre class="json">${esc(pretty(n.input_state))}</pre></details>
        <details open><summary>节点输出（状态更新）</summary><pre class="json">${esc(pretty(n.output_update))}</pre></details>
        ${calls.length ? `<div class="label">模型调用（${calls.length}）</div>` + calls.map(llmCard).join('') : ''}
      </div></div>`;
  }

  function llmCard(c) {
    const req = parse(c.request_body) || {};
    const msgs = Array.isArray(req.messages) ? req.messages : [];
    const text = m => m.text ?? (m.contents || []).map(x => x.text ?? `[${x.type}]`).join('\n');
    return `<div class="card collapsed" style="margin-top:8px"><div class="hd click">
        <b class="mono">${esc(c.purpose || '-')}</b><span class="tag">${esc(c.model_name || '-')}</span>
        ${c.streaming ? '<span class="tag">stream</span>' : ''}
        <span class="grow"></span>
        <span class="mono muted">${c.input_tokens ?? '-'} / ${c.output_tokens ?? '-'} tok · ${c.latency_ms ?? '-'}ms</span>
        <span class="tag ${c.status === 'SUCCESS' ? 'ok' : c.status === 'ERROR' ? 'err' : ''}">${esc(c.status)}</span>
      </div><div class="bd">
        <div class="label">请求参数</div><pre class="json">${esc(pretty(req.parameters))}</pre>
        <div class="label">请求消息（${msgs.length}）</div>
        ${msgs.map(m => `<div class="chatmsg ${esc(m.type)}"><div class="role">${esc(m.type)}</div>${esc(text(m))}</div>`).join('')}
        <div class="label">响应文本</div><pre class="json">${esc(c.response_text ?? c.error_msg ?? '')}</pre>
        <details><summary>原始请求 JSON</summary><pre class="json">${esc(pretty(c.request_body))}</pre></details>
        <details><summary>原始响应 JSON</summary><pre class="json">${esc(pretty(c.response_body))}</pre></details>
      </div></div>`;
  }

  function toolCard(t) {
    return `<div class="card"><div class="hd click"><b class="mono">${esc(t.tool_name)}</b><span class="grow"></span>
        <span class="mono muted">${t.latency_ms ?? '-'}ms</span><span class="tag ${t.status === 'SUCCESS' ? 'ok' : 'err'}">${esc(t.status)}</span>
      </div><div class="bd"><div class="label">参数</div><pre class="json">${esc(pretty(t.arguments))}</pre>
        <div class="label">结果</div><pre class="json">${esc(pretty(t.result ?? t.error_msg))}</pre></div></div>`;
  }

  // ---------------------------------------------------------------- nodes / prompts
  const KIND = {
    TASK_ENTRY: ['多轮任务入口', 'task'],
    ONE_SHOT: ['一次性', ''],
    FALLBACK: ['兜底', 'fb'],
  };
  let nodesData = null;
  let nodesFilter = '';

  async function loadNodes() {
    const pane = $('paneNodes');
    try {
      const r = await fetch('/api/nodes');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      nodesData = await r.json();
      renderNodes();
    } catch (e) {
      pane.innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
    }
  }

  function renderNodes() {
    const d = nodesData; if (!d) return;
    const pane = $('paneNodes');
    const kw = nodesFilter.trim().toLowerCase();

    const routers = d.routers.map(r => {
      const missing = r.children.filter(c => !c.inPrompt).length;
      return `<div class="card"><div class="hd">
          <b>${esc(r.id)}</b><span class="tag">ROUTER</span>
          <span class="muted">已注册 ${r.children.length} 个子节点</span><span class="grow"></span>
          ${missing ? `<span class="tag err">${missing} 个未出现在提示词中</span>` : '<span class="tag ok">全部已写入提示词</span>'}
        </div><div class="bd tablewrap"><table class="reg">
          <thead><tr><th></th><th>意图</th><th>类型</th><th>节点</th><th>描述 / 示例</th></tr></thead>
          <tbody>${r.children.map(c => `<tr>
            <td class="${c.inPrompt ? 'ok' : 'bad'}" title="${c.inPrompt ? '已出现在父节点提示词中' : '没有出现在父节点提示词中'}">${c.inPrompt ? '✓' : '✗'}</td>
            <td class="mono">${esc(c.intent)}<div class="ex">${esc(c.name)} · order ${c.order}</div></td>
            <td><span class="tag ${KIND[c.kind]?.[1] || ''}">${esc(KIND[c.kind]?.[0] || c.kind)}</span></td>
            <td class="mono"><a data-goto="${esc(c.nodeId)}">${esc(c.nodeId)}</a></td>
            <td>${esc(c.description)}${c.examples.length ? `<div class="ex">${c.examples.map(x => '「' + esc(x) + '」').join(' ')}</div>` : ''}</td>
          </tr>`).join('')}</tbody></table></div></div>`;
    }).join('');

    const unattached = d.unattached.length
      ? `<div class="card"><div class="hd"><b>任务后续阶段</b><span class="muted">不挂在路由下，由上一阶段推进过来</span></div>
         <div class="bd path">${d.unattached.map(id => `<a class="node" data-goto="${esc(id)}" style="cursor:pointer">${esc(id)}</a>`).join('')}</div></div>`
      : '';

    // 路由提示词里把子节点的意图编码高亮出来
    const intents = d.routers.flatMap(r => r.children.map(c => c.intent));
    const highlight = (text, isRouter) => {
      let html = esc(text);
      if (isRouter) intents.forEach(i => { html = html.split('- ' + esc(i) + '（').join('- <mark>' + esc(i) + '</mark>（'); });
      return html;
    };

    const nodes = d.nodes.filter(n => !kw
        || n.id.toLowerCase().includes(kw)
        || Object.values(n.prompts || {}).some(p => p.toLowerCase().includes(kw)));
    const cards = nodes.map(n => {
      const prompts = Object.entries(n.prompts || {});
      const route = n.route
        ? `<span class="tag">${esc(n.route.parent)} → ${esc(n.route.intent)}</span>`
        : (n.router ? '' : '<span class="tag">不可被路由直接到达</span>');
      return `<div class="card" id="node-${esc(n.id)}"><div class="hd click">
          <b>${esc(n.id)}</b><span class="tag">${esc(n.type)}</span>${route}
          <span class="grow"></span><span class="mono muted">${esc(n.className)}</span>
        </div><div class="bd">
          ${n.stageDescription ? `<div class="label">任务阶段说明（任务停在这里时会告诉路由模型）</div><div>${esc(n.stageDescription)}</div>` : ''}
          ${prompts.length ? prompts.map(([k, v], i) => `
            <div class="prompt-hd"><span class="mono">${esc(k)}</span><span class="grow"></span>
              <button class="btn" data-copy="${esc(n.id)}" data-idx="${i}">复制</button></div>
            <pre class="json prompt">${highlight(v, n.router && k.endsWith('system'))}</pre>`).join('')
            : '<div class="muted">该节点不调用模型</div>'}
        </div></div>`;
    }).join('');

    pane.innerHTML = `
      <div class="toolbar">
        <input type="text" id="nodeFilter" placeholder="按节点 id 或提示词内容过滤" value="${esc(nodesFilter)}">
        <button class="btn" id="nodesRefresh">刷新</button>
        <span class="mono muted">${esc(d.generatedAt.slice(11, 19))} 生成</span>
      </div>
      <div class="label">注册关系</div>${routers}${unattached}
      <div class="label">节点与提示词（${nodes.length}/${d.nodes.length}）</div>${cards || '<div class="card"><div class="bd muted">没有匹配的节点</div></div>'}`;

    $('nodesRefresh').onclick = loadNodes;
    const input = $('nodeFilter');
    input.oninput = e => {
      nodesFilter = e.target.value;
      const pos = e.target.selectionStart;
      renderNodes();
      const again = $('nodeFilter'); again.focus(); again.setSelectionRange(pos, pos);
    };
    pane.querySelectorAll('[data-goto]').forEach(a => a.onclick = () => {
      const card = document.getElementById('node-' + a.dataset.goto);
      if (!card) return;
      card.classList.remove('collapsed');
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1200);
    });
    pane.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
      const n = d.nodes.find(x => x.id === b.dataset.copy);
      const text = Object.values(n.prompts)[+b.dataset.idx];
      try { await navigator.clipboard.writeText(text); b.textContent = '已复制'; }
      catch { b.textContent = '复制失败'; }
      setTimeout(() => b.textContent = '复制', 1200);
    });
    pane.querySelectorAll('.hd.click').forEach(h => h.onclick = e => {
      if (e.target.closest('a,button')) return;
      h.parentElement.classList.toggle('collapsed');
    });
  }

  // ---------------------------------------------------------------- init
  store.set('flow.sessionId', sessionId);
  loadSessions();
  loadSession();
})();
</script>
</body>
</html>
